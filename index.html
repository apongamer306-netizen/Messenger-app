<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKT CHATING APP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">EKT CHATING APP</div>
    <button class="icon-btn" id="themeToggleBtn">🌙</button>
  </nav>

  <!-- Main Container -->
  <main class="main-container">

    <!-- Dashboard Screen -->
    <div class="card-screen" id="dashboardScreen">
      <div class="profile-header">
        <div class="avatar-container">
          <img src="https://via.placeholder.com/90" id="userAvatar" alt="User Avatar">
          <div class="avatar-edit-badge">📷</div>
        </div>
        <h2 id="userNameDisplay">EYAMIN</h2>
      </div>

      <button id="createRoomBtn" class="btn btn-primary">➕ Create Room</button>
      <button id="joinRoomBtn" class="btn btn-success">➡️ Join Room</button>
      <button id="changePinBtn" class="btn btn-purple">🔑 Change Security PIN</button>
      <button id="removePinBtn" class="btn btn-danger">🗑️ Remove Security PIN</button>
      <button id="logoutBtn" class="btn btn-danger">🔌 Logout</button>
    </div>

    <!-- Admin Chat Room Container -->
    <div class="chat-container" id="chatScreen" style="display: none;">
      <div class="chat-header">
        <div class="user-info">
          <img src="https://via.placeholder.com/40" id="chatUserAvatar" alt="Avatar">
          <div>
            <h3>EYAMIN</h3>
            <small>Admin Room</small>
          </div>
        </div>
        <div>
          <button class="action-btn">📞</button>
          <button class="action-btn">📹</button>
          <button class="action-btn leave-room" id="leaveRoomBtn">🚪</button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- Messages will appear here -->
      </div>

      <div class="chat-input-area">
        <button class="attach-btn">📎</button>
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button class="send-btn" id="sendMsgBtn">➤</button>
      </div>
    </div>

  </main>

  <!-- Create Room Overlay Modal -->
  <div id="createRoomModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Create Room</h3>
      <p>Select room type to create:</p>
      <button id="adminRoomOptionBtn" class="btn btn-primary">Admin Room</button>
      <button id="ownRoomOptionBtn" class="btn btn-success">Own Room (Random Code)</button>
      <button id="cancelCreateModalBtn" class="btn btn-danger" style="background-color: #64748b;">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
