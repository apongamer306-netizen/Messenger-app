<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EK-CHATTER</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Animated Shapes -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Main Container -->
  <div class="app-container">

    <!-- 1. Master Key Screen -->
    <div id="masterKeyScreen" class="card-screen">
      <div class="icon-header">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h2>Security Verification</h2>
      <p>Enter your Master Key to access EK-CHATTER</p>
      
      <div class="input-group">
        <i class="fa-solid fa-key input-icon"></i>
        <input type="password" id="masterKeyInput" placeholder="Master Key">
        <i class="fa-solid fa-eye toggle-pwd" onclick="togglePasswordVisibility('masterKeyInput', this)"></i>
      </div>
      
      <button id="unlockBtn" class="primary-btn">Unlock App</button>
    </div>

    <!-- 2. Auth Screen (Login / Sign Up) -->
    <div id="authScreen" class="card-screen" style="display: none;">
      <div class="icon-header">
        <i class="fa-solid fa-comments"></i>
      </div>
      <h2 id="authTitle">Login Account</h2>

      <div id="signupFields" style="display: none;">
        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="fullNameInput" placeholder="Full Name">
        </div>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-phone input-icon"></i>
        <input type="text" id="phoneInput" placeholder="Phone Number">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="authPasswordInput" placeholder="Password">
        <i class="fa-solid fa-eye toggle-pwd" onclick="togglePasswordVisibility('authPasswordInput', this)"></i>
      </div>

      <button id="authSubmitBtn" class="primary-btn">Login</button>

      <p class="toggle-auth">
        <span id="authToggleMsg">Don't have an account?</span>
        <a href="#" id="authToggleLink">Sign Up</a>
      </p>
    </div>

    <!-- 3. Dashboard Screen -->
    <div id="dashboardScreen" class="card-screen" style="display: none;">
      <div class="dashboard-header">
        <div class="avatar-container">
          <img id="dashboardAvatar" src="https://via.placeholder.com/100" alt="Profile Picture">
          <label for="avatarUpload" class="avatar-edit-btn">
            <i class="fa-solid fa-camera"></i>
          </label>
          <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
        </div>
        <h2 id="dashboardUserName">User Name</h2>
        <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>

      <div class="action-box">
        <h3>Join or Create Room</h3>
        <button id="createRoomBtn" class="secondary-btn">
          <i class="fa-solid fa-plus"></i> Create Instant Room
        </button>
        
        <div class="divider"><span>OR</span></div>

        <div class="input-group">
          <i class="fa-solid fa-door-open input-icon"></i>
          <input type="text" id="roomCodeInput" placeholder="Enter Room Code">
        </div>
        <button id="joinRoomBtn" class="primary-btn">Join Room</button>
      </div>

      <button id="logoutBtn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>

    <!-- 4. Chat Screen -->
    <div id="chatScreen" class="chat-container" style="display: none;">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="chat-user-info">
          <img id="chatUserAvatar" src="https://via.placeholder.com/40" alt="Avatar">
          <div>
            <h4 id="chatUserName">Name</h4>
            <span id="chatRoomCode" class="room-tag">Code: ------</span>
          </div>
        </div>
        
        <div class="chat-actions">
          <button id="startAudioCallBtn" class="icon-btn" title="Audio Call">
            <i class="fa-solid fa-phone"></i>
          </button>
          <button id="startVideoCallBtn" class="icon-btn" title="Video Call">
            <i class="fa-solid fa-video"></i>
          </button>
          <button id="leaveRoomBtn" class="icon-btn danger" title="Leave Room">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <!-- Messages Body -->
      <div id="chatMessages" class="chat-messages"></div>

      <!-- Chat Footer / Input -->
      <div class="chat-footer">
        <label for="fileAttachmentInput" class="attach-btn" title="Send Media">
          <i class="fa-solid fa-paperclip"></i>
        </label>
        <input type="file" id="fileAttachmentInput" accept="image/*,video/*" style="display: none;">

        <input type="text" id="chatMessageInput" placeholder="Type a message...">
        
        <button id="sendMessageBtn" class="send-btn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Call Modal (Audio/Video Call Overlay) -->
  <div id="callModal" class="modal-overlay" style="display: none;">
    <div class="call-card">
      <div class="video-grid">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <p id="callStatusText">Calling...</p>
      
      <div class="call-actions">
        <button id="acceptCallBtn" class="call-btn accept" style="display: none;">
          <i class="fa-solid fa-phone-flip"></i> Accept
        </button>
        <button id="rejectCallBtn" class="call-btn reject">
          <i class="fa-solid fa-phone-slash"></i> End
        </button>
      </div>
    </div>
  </div>

  <!-- Socket.io Client JS -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- PeerJS Client JS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Custom App JS -->
  <script src="app.js"></script>
</body>
</html>
