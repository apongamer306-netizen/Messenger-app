<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKT CHATING APP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme admin-theme">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">EKT CHATING APP</div>
    <button id="themeToggleBtn" class="icon-btn"><i class="fas fa-moon"></i></button>
  </nav>

  <!-- Main Container -->
  <div class="main-container">

    <!-- 1. Master Key Screen -->
    <div id="masterKeyScreen" class="card-screen" style="display: none;">
      <h2 id="masterTitle">Security Lock</h2>
      <p id="masterSubtitle" style="color: #94a3b8; margin-bottom: 15px; font-size: 0.9rem;"></p>
      
      <div id="passInputGroup" class="input-wrapper">
        <input type="password" id="masterKeyInput" placeholder="Enter Security PIN">
        <i class="fas fa-eye toggle-eye" onclick="togglePasswordVisibility('masterKeyInput', this)"></i>
      </div>

      <button id="unlockBtn" class="btn btn-primary">Unlock</button>
      <button id="directOpenBtn" class="btn btn-primary" style="display: none; background-color: #10b981;">Open Directly</button>

      <p class="auth-toggle-text">
        <span id="masterToggleMsg"></span> 
        <a href="#" id="masterToggleLink"></a>
      </p>
    </div>

    <!-- 2. Authentication Screen (Login / Sign Up) -->
    <div id="authScreen" class="card-screen" style="display: none;">
      <h2 id="authTitle">Login Account</h2>
      
      <div id="signupFields" style="display: none;">
        <div class="input-wrapper">
          <input type="text" id="fullNameInput" placeholder="Full Name">
        </div>
        <!-- Sign Up Profile Picture Upload -->
        <div class="input-wrapper">
          <label style="color: #94a3b8; font-size: 0.85rem; display: block; text-align: left; margin-bottom: 5px;">Profile Picture:</label>
          <input type="file" id="signupAvatarInput" accept="image/*" style="padding: 8px;">
        </div>
      </div>

      <div class="input-wrapper">
        <input type="text" id="phoneInput" placeholder="Phone Number">
      </div>

      <div class="input-wrapper">
        <input type="password" id="authPasswordInput" placeholder="Password">
        <i class="fas fa-eye toggle-eye" onclick="togglePasswordVisibility('authPasswordInput', this)"></i>
      </div>

      <button id="authSubmitBtn" class="btn btn-primary">Login</button>

      <p class="auth-toggle-text">
        <span id="authToggleMsg">Don't have an account?</span> 
        <a href="#" id="authToggleLink">Sign Up</a>
      </p>
      <p class="footer-text">DEVELOPED BY EYAMIN</p>
    </div>

    <!-- 3. Dashboard Screen -->
    <div id="dashboardScreen" class="card-screen" style="display: none;">
      <div class="profile-header">
        <div class="avatar-container">
          <img id="dashboardAvatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile">
          <label for="avatarUpload" class="avatar-edit-badge">
            <i class="fas fa-camera"></i>
          </label>
          <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
        </div>
        <h3 id="dashboardUserName">User Name</h3>
      </div>

      <button id="createRoomBtn" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Create Room</button>
      <button id="joinRoomBtn" class="btn btn-primary" style="background-color: #10b981; margin-top: 10px;"><i class="fas fa-sign-in-alt"></i> Join Room</button>
      
      <div style="margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px;">
        <button id="setPinBtn" class="btn btn-primary" style="background-color: #6366f1;"><i class="fas fa-key"></i> <span id="setPinBtnText">Set Security PIN</span></button>
        <button id="removePinBtn" class="btn btn-danger" style="margin-top: 5px; display: none;"><i class="fas fa-trash"></i> Remove Security PIN</button>
        <button id="logoutBtn" class="btn btn-danger" style="margin-top: 10px;"><i class="fas fa-power-off"></i> Logout</button>
      </div>
    </div>

    <!-- 4. Chat Screen -->
    <div id="chatScreen" class="chat-container" style="display: none;">
      <div class="chat-header">
        <div class="user-info">
          <img id="chatUserAvatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="User">
          <div>
            <h4 id="chatUserName">User Name</h4>
            <span id="chatRoomCode" style="font-size: 0.75rem; color: #94a3b8;">Code: ------</span>
          </div>
        </div>
        <div>
          <button id="startAudioCallBtn" class="action-btn"><i class="fas fa-phone"></i></button>
          <button id="startVideoCallBtn" class="action-btn"><i class="fas fa-video"></i></button>
          <button id="leaveRoomBtn" class="action-btn leave-room"><i class="fas fa-sign-out-alt"></i></button>
        </div>
      </div>

      <div id="chatMessages" class="chat-messages"></div>

      <div class="chat-input-area">
        <label for="fileAttachmentInput" class="attach-btn"><i class="fas fa-paperclip"></i></label>
        <input type="file" id="fileAttachmentInput" style="display: none;">
        <input type="text" id="chatMessageInput" placeholder="Type a message...">
        <button id="sendMessageBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>

  </div>

  <!-- Custom Alert/Prompt Modal Overlay -->
  <div id="customModalOverlay" class="call-modal" style="display: none;">
    <div class="call-box">
      <h3 id="modalTitle">Notice</h3>
      <p id="modalSubtitle" style="color: #94a3b8; margin: 10px 0; font-size: 0.9rem;"></p>
      <div id="modalInputGroup" class="input-wrapper" style="display: none;">
        <input type="text" id="modalInput">
      </div>
      <div id="modalActionContainer" style="margin-top: 15px;"></div>
    </div>
  </div>

  <!-- Call Modal Overlay -->
  <div id="callModal" class="call-modal" style="display: none;">
    <div class="call-box">
      <h3 id="callStatusText">Calling...</h3>
      
      <!-- Video Grid -->
      <div id="callVideoGrid" class="video-grid" style="display: none;">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>

      <!-- Audio Call Profile Grid -->
      <div id="callProfileGrid" class="call-profile-grid">
        <div class="call-profile-item">
          <img id="localCallAvatar" class="call-avatar" src="https://ui-avatars.com/api/?name=Me&background=random">
          <span id="localCallName" class="call-username">Me</span>
        </div>
        <div class="call-profile-item">
          <img id="remoteCallAvatar" class="call-avatar" src="https://ui-avatars.com/api/?name=User&background=random">
          <span id="remoteCallName" class="call-username">User</span>
        </div>
      </div>

      <div class="call-controls">
        <button id="acceptCallBtn" class="btn-call accept"><i class="fas fa-phone"></i> Accept</button>
        <button id="rejectCallBtn" class="btn-call reject"><i class="fas fa-phone-slash"></i> End</button>
      </div>
    </div>
  </div>

  <!-- Socket.io & PeerJS Dependencies -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
